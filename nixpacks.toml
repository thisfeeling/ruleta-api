# Nixpacks config for ruleta-api (production)
# - Uses PHP 8.4, Composer via phpPackages.composer
# - Does NOT install the php redis extension nor the redis server (we use predis via Composer)
# - Supervisor will run nginx, php-fpm, queue workers and reverb, but NOT redis

[phases.setup]
# List of packages from nixpkgs required at setup time
nixPkgs = [
    "php84",
    "php84Extensions.mbstring",
    "php84Extensions.curl",
    "php84Extensions.pdo",
    "php84Extensions.bcmath",
    "php84Extensions.tokenizer",
    "php84Extensions.dom",
    "php84Extensions.gd",
    "php84Extensions.fileinfo",
    "php84Extensions.xml",
    "php84Extensions.zip",
    "phpPackages.composer",
    "nodejs_22",
    "python311Packages.supervisor",
    "nginx",
    "libmysqlclient",
    "curl",
    "wget"
]

[phases.build]
cmds = [
    # Ensure PHP additional ini files dir exists
    "mkdir -p $(php -i | grep 'additional .ini files' | awk '{print $NF}')",

    # Run custom PHP extension setup (use the one from .docker folder)
    "chmod +x /app/.docker/setup-php-extensions.sh",
    "bash /app/.docker/setup-php-extensions.sh",

    # Ensure prestart script is available where start.sh expects it
    "mkdir -p /assets/scripts",
    "cp /app/.docker/prestart.mjs /assets/scripts/prestart.mjs",

    # Prepare supervisor directory and only copy the worker processes we want
    "mkdir -p /etc/supervisor/conf.d/",
    "cp /assets/worker-nginx.conf /etc/supervisor/conf.d/",
    "cp /assets/worker-phpfpm.conf /etc/supervisor/conf.d/",
    "cp /assets/worker-laravel.conf /etc/supervisor/conf.d/",
    "cp /assets/worker-reverb.conf /etc/supervisor/conf.d/",

    # Copy supervisord main config and make scripts executable
    "cp /assets/supervisord.conf /etc/supervisord.conf",
    "chmod +x /assets/start.sh",
    "chmod +x deploy.sh",

    # Run deploy (composer install & build assets)
    "bash deploy.sh"
]

# Entrypoint executed by the platform
[start]
cmd = '/assets/start.sh'

# Static assets to be embedded into the image so the build is self-contained
[staticAssets]
"start.sh" = '''#!/bin/bash

# Transform the nginx configuration
node /assets/scripts/prestart.mjs /assets/nginx.template.conf /etc/nginx.conf

# Start supervisor
supervisord -c /etc/supervisord.conf -n
'''

"supervisord.conf" = '''[unix_http_server]
file=/assets/supervisor.sock

[supervisord]
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/assets/supervisord.pid
nodaemon=false
silent=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///assets/supervisor.sock

[include]
files = /etc/supervisor/conf.d/*.conf
'''

"worker-nginx.conf" = '''[program:worker-nginx]
process_name=%(program_name)s_%(process_num)02d
command=nginx -c /etc/nginx.conf
autostart=true
autorestart=true
stdout_logfile=/var/log/worker-nginx.log
stderr_logfile=/var/log/worker-nginx.log
'''

"worker-phpfpm.conf" = '''[program:worker-phpfpm]
process_name=%(program_name)s_%(process_num)02d
command=php-fpm -y /assets/php-fpm.conf -F
autostart=true
autorestart=true
stdout_logfile=/var/log/worker-phpfpm.log
stderr_logfile=/var/log/worker-phpfpm.log
'''

"worker-laravel.conf" = '''[program:worker-laravel]
process_name=%(program_name)s_%(process_num)02d
# Explicitly use the redis queue driver (Laravel will read QUEUE_CONNECTION env var by default)
command=bash -c 'exec php /app/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
startsecs=0
stopwaitsecs=3600
stdout_logfile=/var/log/worker-laravel.log
stderr_logfile=/var/log/worker-laravel.log
'''

"worker-reverb.conf" = '''[program:worker-reverb]
process_name=%(program_name)s_%(process_num)02d
command=bash -c 'exec php /app/artisan reverb:start --host=0.0.0.0 --port=8080'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
startsecs=0
stdout_logfile=/var/log/worker-reverb.log
stderr_logfile=/var/log/worker-reverb.log
'''

"php-fpm.conf" = '''[www]
listen = 127.0.0.1:9000
user = www-data
group = www-data
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 50
pm.min_spare_servers = 4
pm.max_spare_servers = 32
pm.start_servers = 18
clear_env = no
php_admin_value[post_max_size] = 35M
php_admin_value[upload_max_filesize] = 30M
'''

"nginx.template.conf" = '''user www-data www-data;
worker_processes 5;
daemon off;

worker_rlimit_nofile 8192;

events {
  worker_connections  4096;  # Default: 1024
}

http {
    include    $!{nginx}/conf/mime.types;
    index    index.html index.htm index.php;

    default_type application/octet-stream;
    log_format   main '$remote_addr - $remote_user [$time_local]  $status '
        '"$request" $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx-access.log;
    error_log /var/log/nginx-error.log;
    sendfile     on;
    tcp_nopush   on;
    server_names_hash_bucket_size 128; # this seems to be required for some vhosts

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name localhost;

        $if(NIXPACKS_PHP_ROOT_DIR) (
            root ${NIXPACKS_PHP_ROOT_DIR};
        ) else (
            root /app;
        )

        add_header X-Content-Type-Options "nosniff";

        client_max_body_size 35M;

        index index.php;

        charset utf-8;


        $if(NIXPACKS_PHP_FALLBACK_PATH) (
            location / {
                try_files $uri $uri/ ${NIXPACKS_PHP_FALLBACK_PATH}?$query_string;
            }
        ) else (
          location / {
                try_files $uri $uri/ /index.php?$query_string;
           }
        )

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        $if(IS_LARAVEL) (
            error_page 404 /index.php;
        ) else ()

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
'''
